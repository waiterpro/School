<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Розклад школи</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#182338;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#203c7c,#5174cd);color:white;padding:38px 20px 55px}.wrap{max-width:980px;margin:auto}h1{font-size:clamp(28px,4vw,40px);margin:0 0 7px}.intro{opacity:.85;margin:0}main{margin-top:-30px;padding:0 16px 45px}.panel{background:white;padding:24px;border-radius:19px;box-shadow:0 12px 36px #1a3a731a}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px;color:#4c5870}select,button{width:100%;font:inherit;border-radius:10px;padding:11px;border:1px solid #dce1eb;background:white}button{border:0;background:#2f57be;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.6;cursor:wait}.daytabs{display:flex;gap:8px;overflow:auto;margin:22px 0}.daytabs button{min-width:max-content;background:#eef2fc;color:#3151a1;padding:10px 13px}.daytabs button.active{background:#3159be;color:#fff}.status{font-size:13px;color:#5b6678;margin-top:15px;line-height:1.5}.warning{background:#fff4df;color:#805214;padding:12px;border-radius:10px;margin:14px 0}.lesson{display:flex;gap:16px;align-items:center;padding:16px;border:1px solid #e8ecf3;border-radius:14px;margin:10px 0}.num{flex:none;display:grid;place-items:center;background:#e9efff;color:#244da8;border-radius:12px;width:46px;height:46px;font-size:19px;font-weight:750}.lesson strong{display:block;font-size:17px;overflow-wrap:anywhere}.time{font-size:13px;color:#687389;margin-top:5px}.empty{padding:30px;text-align:center;color:#687389}h2{font-size:20px;margin:14px 0}.foot{font-size:12px;color:#657087;margin-top:18px}@media(max-width:640px){.controls{grid-template-columns:1fr}.panel{padding:17px}header{padding-top:28px}.lesson{padding:12px}}
</style></head><body><header><div class="wrap"><h1>Шкільний розклад</h1><p class="intro">Актуальні уроки за класами та днями тижня</p></div></header><main class="wrap"><div class="panel"><div class="controls"><div><label for="sheet">Вкладка</label><select id="sheet"></select></div><div><label for="klass">Клас</label><select id="klass"></select></div><div><button id="update">↻ Оновити</button></div></div><div class="daytabs" id="tabs"></div><div id="banner"></div><h2 id="heading">Розклад</h2><div id="lessons"><div class="empty">Завантаження розкладу…</div></div><div class="status" id="status"></div><p class="foot">Дані беруться з Google Таблиці в режимі лише читання. Автоматична перевірка — щогодини, поки сайт відкритий. Об’єднані комірки визначаються заново з актуального XLSX.</p></div></main><script>
const $=id=>document.getElementById(id);let data=null,sheet='',klass='',day='',lastLoad=0;const LS='school-settings';const days=['Понеділок','Вівторок','Середа','Четвер','П’ятниця'];try{let saved=JSON.parse(localStorage.getItem(LS)||'{}');sheet=saved.sheet||'';klass=saved.klass||'';day=saved.day||''}catch{}if(!day){const d=new Date().getDay();day=days[d===0?0:Math.min(d-1,4)]}function save(){try{localStorage.setItem(LS,JSON.stringify({sheet,klass,day}))}catch{}}function fill(sel,values,picked){sel.replaceChildren();values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.append(o)});if(values.includes(picked))sel.value=picked;else if(values.length)sel.value=values[0];return sel.value}function render(){if(!data)return;const names=Object.keys(data.sheets);sheet=fill($('sheet'),names,sheet);const s=data.sheets[sheet];klass=fill($('klass'),Object.keys(s.classes),klass);day=days.includes(day)?day:days[0];save();$('tabs').replaceChildren();days.forEach(d=>{const b=document.createElement('button');b.textContent=d;b.className=d===day?'active':'';b.onclick=()=>{day=d;render()};$('tabs').append(b)});$('heading').textContent=`${klass} · ${day}`;const lessons=s.classes[klass][day]||[];$('lessons').replaceChildren();if(!lessons.length){const e=document.createElement('div');e.className='empty';e.textContent='На цей день уроків не знайдено';$('lessons').append(e)}for(const l of lessons){const item=document.createElement('div');item.className='lesson';const n=document.createElement('span');n.className='num';n.textContent=l.number;const info=document.createElement('div');const sub=document.createElement('strong');sub.textContent=l.subject;const tm=document.createElement('div');tm.className='time';tm.textContent=l.time;info.append(sub,tm);item.append(n,info);$('lessons').append(item)}$('banner').replaceChildren();if(data.warning){const w=document.createElement('div');w.className='warning';w.textContent=data.warning;$('banner').append(w)}$('status').textContent=`Джерело: ${data.source==='google'?'Google Таблиця':'зразок Excel (неактуальні дані)'}. ${data.updatedAt?'Останнє успішне завантаження: '+new Date(data.updatedAt).toLocaleString('uk-UA'):''} Об’єднаних комірок у вкладці: ${s.mergeCount}.`}
async function load(force=false){$('update').disabled=true;try{const r=await fetch('/api/schedule'+(force?'?refresh=1':''),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);data=j;lastLoad=Date.now();render()}catch(e){$('banner').textContent='';const w=document.createElement('div');w.className='warning';w.textContent='Не вдалося завантажити розклад: '+e.message;$('banner').append(w);if(!data)$('lessons').textContent='Немає доступних даних'}finally{$('update').disabled=false}}$('sheet').onchange=()=>{sheet=$('sheet').value;klass='';render()};$('klass').onchange=()=>{klass=$('klass').value;render()};$('update').onclick=()=>load(true);load();setInterval(()=>load(),3600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastLoad>=3600000)load()});
</script></body></html>
